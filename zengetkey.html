<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b1a">
<title>Zen Cloud - GetKey</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:#050816;
  background-image:
    radial-gradient(circle at 20% 20%,rgba(0,229,255,.16),transparent 28%),
    radial-gradient(circle at 80% 75%,rgba(125,70,255,.18),transparent 30%);
}
canvas{position:fixed;inset:0;z-index:0}
.card{
  position:relative;z-index:2;width:min(92%,430px);padding:30px 24px;
  border:1px solid rgba(0,229,255,.35);border-radius:24px;
  background:rgba(8,14,34,.72);backdrop-filter:blur(18px);
  box-shadow:0 0 35px rgba(0,229,255,.15),inset 0 0 30px rgba(255,255,255,.025);
  text-align:center;
}
.logo{
  width:72px;height:72px;margin:0 auto 14px;border-radius:20px;
  display:grid;place-items:center;font-size:30px;font-weight:900;
  background:linear-gradient(135deg,#00e5ff,#7657ff);
  box-shadow:0 0 30px rgba(0,229,255,.4);
}
h1{margin:8px 0 6px;font-size:28px}
.sub{margin:0 0 22px;color:#9eabc8;font-size:14px}
.timer{
  font-size:58px;font-weight:900;letter-spacing:2px;margin:8px 0 18px;
  text-shadow:0 0 18px rgba(0,229,255,.7);
}
.progress{height:9px;background:#111a35;border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#7c4dff);box-shadow:0 0 15px #00e5ff;transition:width .25s}
button{
  width:100%;border:0;border-radius:14px;padding:14px 18px;font-size:16px;
  font-weight:800;color:#041019;background:linear-gradient(90deg,#00e5ff,#6c63ff);
  cursor:pointer;box-shadow:0 0 20px rgba(0,229,255,.2);transition:.2s;
}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 28px rgba(0,229,255,.45)}
button:disabled{cursor:not-allowed;opacity:.45}
.keybox{display:none;margin-top:18px}
.key{
  padding:14px;border:1px solid rgba(0,229,255,.3);border-radius:12px;
  background:#050a18;color:#00e5ff;font-weight:800;word-break:break-all;margin-bottom:10px
}
.notice{font-size:12px;color:#8190b0;margin-top:17px;line-height:1.5}
.status{min-height:20px;color:#aeb9d3;font-size:13px;margin:8px 0 0}
@media(max-width:420px){.card{padding:25px 18px}.timer{font-size:48px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<main class="card">
  <div class="logo">Z</div>
  <h1>ZEN CLOUD</h1>
  <p class="sub">GET KEY • Vui lòng chờ đủ 4 phút</p>

  <div class="timer" id="timer">04:00</div>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <button id="getBtn" disabled>⏳ Đang chờ...</button>
  <div class="status" id="status">Hệ thống đang đếm ngược 240 giây.</div>

  <div class="keybox" id="keybox">
    <div class="key" id="key"></div>
    <button id="copyBtn">📋 Sao chép Key</button>
  </div>

  <p class="notice">Không đóng hoặc tải lại trang trong thời gian chờ. Key demo được tạo ngay trên trình duyệt.</p>
</main>

<script>
// =============================
// ZEN CLOUD GETKEY - STATIC DEMO
// 240 giây = 4 phút
// =============================
const WAIT_SECONDS = 240;

const timerEl = document.getElementById("timer");
const barEl = document.getElementById("bar");
const getBtn = document.getElementById("getBtn");
const statusEl = document.getElementById("status");
const keybox = document.getElementById("keybox");
const keyEl = document.getElementById("key");
const copyBtn = document.getElementById("copyBtn");

let remaining = WAIT_SECONDS;
let finished = false;

function formatTime(sec){
  const m = Math.floor(sec / 60).toString().padStart(2,"0");
  const s = (sec % 60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function update(){
  timerEl.textContent = formatTime(remaining);
  const percent = ((WAIT_SECONDS - remaining) / WAIT_SECONDS) * 100;
  barEl.style.width = `${percent}%`;
}

const countdown = setInterval(() => {
  remaining--;
  update();

  if(remaining <= 0){
    clearInterval(countdown);
    finished = true;
    getBtn.disabled = false;
    getBtn.textContent = "🔑 GET KEY";
    statusEl.textContent = "Đã hoàn tất thời gian chờ. Nhấn GET KEY.";
  }
}, 1000);

getBtn.addEventListener("click", () => {
  if(!finished) return;

  const random = crypto.getRandomValues(new Uint32Array(3));
  const key = "ZEN-" +
    random[0].toString(36).toUpperCase().padStart(7,"0").slice(0,7) + "-" +
    random[1].toString(36).toUpperCase().padStart(7,"0").slice(0,7) + "-" +
    random[2].toString(36).toUpperCase().padStart(7,"0").slice(0,7);

  keyEl.textContent = key;
  keybox.style.display = "block";
  getBtn.style.display = "none";
  statusEl.textContent = "Key đã được tạo. Hãy sao chép key.";
});

copyBtn.addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(keyEl.textContent);
    copyBtn.textContent = "✅ Đã sao chép!";
    setTimeout(() => copyBtn.textContent = "📋 Sao chép Key", 1600);
  }catch{
    alert("Không thể tự động sao chép. Hãy giữ và sao chép key thủ công.");
  }
});

// Sao chuyển động
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let stars = [];

function resize(){
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  stars = Array.from({length: Math.min(120, Math.floor(innerWidth/8))}, () => ({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*1.7+.3,
    s:Math.random()*.35+.08,
    a:Math.random()
  }));
}
addEventListener("resize",resize);
resize();

function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const st of stars){
    st.y += st.s;
    if(st.y > innerHeight+3){st.y=-3;st.x=Math.random()*innerWidth}
    st.a += .02;
    const alpha = .35 + Math.sin(st.a)*.3;
    ctx.beginPath();
    ctx.arc(st.x,st.y,st.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(120,225,255,${alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

update();
</script>
</body>
</html>
